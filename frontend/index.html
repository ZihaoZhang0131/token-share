      THESIS: Token Station opens directly into the real member console; authentication unlocks private data and actions instead of hiding the product behind a landing page.

      INTERACTION: Public tabs remain usable. Identity-bound actions open the accessible login dialog, while authenticated API and role behavior remain authoritative.
      BOUNDARY: No public registration, fabricated usage, model access, or access keys. Guest values stay empty or zero until a real session is established.
      RESPONSIVE: The existing console layout and navigation collapse into the same mobile interface for guests and members.
